<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fotomatón de la boda</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#111; --card:#1b1b1b; --accent:#7c8347; --text:#f4f1ea; --muted:#9a9a94; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{ background:#0d0d0d; color:var(--text); font-family:'Jost', sans-serif;
    display:flex; align-items:center; justify-content:center;
    height:100vh; height:100dvh; }
  .screen{ width:100vw; height:100vh; height:100dvh; display:none; flex-direction:column;
    align-items:center; justify-content:center; padding:20px; position:relative; }
  .screen.active{display:flex;}
  #screen-select .logo{ max-width:240px; width:60vw; height:auto; margin-bottom:6px; }
  #screen-select p.sub{color:var(--muted); margin:0 0 18px; font-size:14px; letter-spacing:.5px; text-align:center;}
  .frame-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
    max-width:920px; width:100%; overflow-y:auto; padding:4px; -webkit-overflow-scrolling:touch; }
  .frame-card{ background:var(--card); border-radius:14px; padding:8px; cursor:pointer;
    border:2px solid transparent; transition:.15s; text-align:center; }
  .frame-card:active{transform:scale(.96);}
  .frame-card.selected{border-color:var(--accent);}
  .frame-card img{width:100%; height:auto; border-radius:8px; display:block; background:#fff;}
  .frame-card .lbl{font-size:11px; color:var(--muted); margin-top:5px;}
  .btn{ margin-top:22px; background:var(--accent); color:#fff; border:none;
    padding:15px 40px; border-radius:30px; font-size:16px; font-weight:600;
    letter-spacing:.5px; cursor:pointer; font-family:'Jost',sans-serif; }
  .btn:disabled{opacity:.35;}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid #444;}
  #screen-capture{background:#000;}
  #video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scaleX(-1); background:#000; }
  .frame-overlay{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    pointer-events:none; z-index:1; opacity:0; transition:opacity .25s; }
  .frame-overlay.visible{ opacity:1; }
  .capture-overlay{ position:relative; z-index:2; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    pointer-events:none; }
  .shot-progress{ background:rgba(0,0,0,.5); padding:7px 18px; border-radius:20px; font-size:13px; letter-spacing:1px; }
  .countdown{ font-size:min(140px, 30vw); font-weight:700; text-shadow:0 4px 24px rgba(0,0,0,.6); font-family:'Jost',sans-serif; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:3; pointer-events:none; }
  .flash.on{opacity:1; transition:opacity .05s;}
  .flash.off{opacity:0; transition:opacity .4s;}
  .cam-controls{ display:flex; gap:36px; pointer-events:all; z-index:4; }
  .icon-btn{ width:54px; height:54px; border-radius:50%; background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.3); color:#fff; font-size:22px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .back-btn{ position:absolute; top:max(16px, env(safe-area-inset-top)); left:16px;
    background:var(--card); border-color:#444; z-index:5; }
  #screen-processing{gap:16px;}
  #screen-processing .spinner{width:34px;height:34px;border-width:4px;}
  #screen-result img.resultImg{ max-width:min(80vw, 380px); max-height:52vh; border-radius:6px;
    box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .result-row{display:flex; gap:14px; margin-top:18px; flex-wrap:wrap; justify-content:center;}
  #btnNewSession{margin-top:12px;}
  #status{color:var(--muted); font-size:13px; margin-top:12px; min-height:18px; text-align:center; padding:0 10px;}
  .spinner{ width:22px; height:22px; border:3px solid #333; border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block;
    vertical-align:middle; margin-right:8px; }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading{position:fixed; inset:0; background:#0d0d0d; display:flex; align-items:center;
    justify-content:center; z-index:99; color:var(--muted); font-size:14px; text-align:center; padding:20px;}
  @media (min-width:600px){
    .frame-grid{ grid-template-columns:repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div id="loading"><span class="spinner"></span>&nbsp;Cargando marcos…</div>

<div id="screen-select" class="screen">
  <img class="logo" src="" id="logoImg" alt="Seba & Teresa">
  <p class="sub">Elige tu marco antes de la foto</p>
  <div class="frame-grid" id="frameGrid"></div>
  <button class="btn" id="btnContinue" disabled>Continuar</button>
</div>

<div id="screen-capture" class="screen">
  <video id="video" autoplay playsinline muted></video>
  <div class="flash" id="flash"></div>
  <div class="capture-overlay">
    <div class="shot-progress" id="shotProgress">Foto 1 de 1</div>
    <div class="countdown" id="countdown"></div>
    <div class="cam-controls">
      <div class="icon-btn" id="btnCancel">✕</div>
      <div class="icon-btn" id="btnFlip">⟲</div>
    </div>
  </div>
</div>

<div id="screen-processing" class="screen">
  <span class="spinner"></span>
  <div>Componiendo tu foto…</div>
</div>

<div id="screen-result" class="screen">
  <div class="icon-btn back-btn" id="btnBackToFrames">←</div>
  <img class="resultImg" id="resultImg" alt="Foto">
  <div id="status"></div>
  <div class="result-row">
    <button class="btn secondary" id="btnRetry">Repetir</button>
    <button class="btn" id="btnSave">Guardar foto</button>
  </div>
  <button class="btn secondary" id="btnNewSession">Elegir otro marco</button>
</div>

<script>
const CANVAS_W = 1080, CANVAS_H = 1920;

// Coordenadas del hueco de foto dentro de cada plantilla (1080x1920).
// El "id" tiene que coincidir con el nombre del archivo subido a Drive (sin .png)
const FRAME_DEFS = [
  { id:"marco1", label:"2 fotos", windows:[{x:0,y:0,w:1080,h:938},{x:0,y:981,w:1080,h:939}] },
  { id:"marco2", label:"3 fotos", windows:[{x:0,y:0,w:1080,h:618},{x:0,y:661,w:1080,h:597},{x:0,y:1301,w:1080,h:619}] },
  { id:"marco3", label:"2 fotos", windows:[{x:108,y:108,w:860, h:572},{x:112,y:710,w:860, h:572}] },
  { id:"marco4", label:"3 fotos", windows:[{x:332,y:186,w:440, h:357},{x:332,y:566,w:440, h:357},{x:332,y:947,w:440, h:357}] },
  { id:"marco5", label:"1 foto",  windows:[{x:214,y:369,w:652, h:1054}] },
  { id:"marco6", label:"1 foto",  windows:[{x:73,y:108,w:934,h:1295}] },
];

let selectedFrame = null;
let shots = [];
const frameFullCache = {}; // id -> Promise<Image>, para no pedir el mismo marco dos veces
let currentFacing = 'user';

/* =========================================================================
   1) SELECCIÓN — solo miniaturas ligeras, nada a tamaño completo todavía
   ========================================================================= */
// PEGA AQUÍ la URL de tu Apps Script (termina en /exec)
const EXEC_URL = "https://script.google.com/macros/s/AKfycbx_QvjHQVwJPQnM7UdSMC_BCZb9SGlQy3hp7hPi00fVvE2hha9Yah1-L-uBZpbwRq-f/exec";

// Interpreta la respuesta como texto primero, y solo luego como JSON.
// Si el servidor devuelve algo que no es JSON (p.ej. una página de error
// de Google), esto lo detecta y muestra el texto real en vez de un error
// críptico de "JSON inválido".
async function parseApiResponse_(res){
  const text = await res.text();
  let data;
  try{
    data = JSON.parse(text);
  }catch(e){
    const preview = text.slice(0, 180).replace(/\s+/g,' ').trim();
    throw new Error('El servidor no devolvió datos válidos (HTTP ' + res.status + '). Respuesta: ' + preview);
  }
  if(!data.success) throw new Error(data.error || 'Error desconocido');
  return data;
}

async function apiGet(action, params={}){
  if(!EXEC_URL || EXEC_URL.indexOf('PON_AQUI') === 0){
    throw new Error('Falta configurar EXEC_URL en index.html con la URL de tu Apps Script.');
  }
  const qs = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(EXEC_URL + '?' + qs);
  return parseApiResponse_(res);
}

// Apps Script responde a las peticiones POST con una redirección interna, y
// Safari (siguiendo el estándar HTTP) convierte ese POST en un GET al
// seguirla, perdiendo los datos de la foto por el camino ("Acción
// desconocida: undefined"). XMLHttpRequest no tiene ese problema aquí, así
// que usamos eso en vez de fetch() solo para el guardado.
function apiPost(body){
  return new Promise((resolve, reject)=>{
    if(!EXEC_URL || EXEC_URL.indexOf('PON_AQUI') === 0){
      reject(new Error('Falta configurar EXEC_URL en index.html con la URL de tu Apps Script.'));
      return;
    }
    const xhr = new XMLHttpRequest();
    xhr.open('POST', EXEC_URL, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); // evita preflight CORS
    xhr.onload = function(){
      const text = xhr.responseText;
      let data;
      try{
        data = JSON.parse(text);
      }catch(e){
        const preview = text.slice(0, 180).replace(/\s+/g,' ').trim();
        reject(new Error('El servidor no devolvió datos válidos (HTTP ' + xhr.status + '). Respuesta: ' + preview));
        return;
      }
      if(!data.success){
        reject(new Error(data.error || 'Error desconocido'));
        return;
      }
      resolve(data);
    };
    xhr.timeout = 90000; // si tarda más de 90 s, avisar en vez de quedarse colgado
    xhr.ontimeout = function(){ reject(new Error('Tiempo de espera agotado al subir la foto.')); };
    xhr.onerror = function(){
      reject(new Error('Fallo de red al guardar la foto.'));
    };
    xhr.send(JSON.stringify(body));
  });
}

async function init(){
  let thumbs;
  try{
    const r = await apiGet('thumbnails');
    thumbs = r.thumbnails;
  }catch(e){
    document.getElementById('loading').innerHTML = 'No se pudieron cargar los marcos.<br>' + e.message;
    return;
  }

  document.getElementById('logoImg').src = thumbs['logo'] || '';

  const frameGrid = document.getElementById('frameGrid');
  FRAME_DEFS.forEach(def=>{
    if(!thumbs[def.id]) return;
    const card = document.createElement('div');
    card.className = 'frame-card';
    const img = document.createElement('img');
    img.src = thumbs[def.id];
    img.loading = 'lazy';
    const lbl = document.createElement('div');
    lbl.className='lbl';
    lbl.textContent = def.label;
    card.appendChild(img); card.appendChild(lbl);
    card.onclick = ()=>{
      document.querySelectorAll('.frame-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selectedFrame = def;
      document.getElementById('btnContinue').disabled = false;
    };
    frameGrid.appendChild(card);
  });

  document.getElementById('loading').style.display = 'none';
  showScreen('screen-select');
}

document.getElementById('btnContinue').onclick = ()=> goToCapture();

/* =========================================================================
   2) CÁMARA
   ========================================================================= */
const video = document.getElementById('video');
const flashEl = document.getElementById('flash');
let stream = null;

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode: currentFacing, width:{ideal:1080}, height:{ideal:1440} }, // 3:4 = formato nativo del sensor, sin recorte/zoom
      audio:false
    });
    video.srcObject = stream;
    video.style.transform = currentFacing==='user' ? 'scaleX(-1)' : 'none';
  }catch(e){
    showFatalError('No se pudo abrir la cámara: ' + e.message);
  }
}

// Pide la imagen completa de un marco (una sola vez por marco, cacheada) y
// la deja lista en memoria. Se lanza en paralelo con la cámara para que
// cuando termines de hacer las fotos, ya esté cargada y no haya que esperar.
function preloadFrameFull(id){
  if(!frameFullCache[id]){
    frameFullCache[id] = apiGet('frame', {id}).then(r => loadImage(r.image));
  }
  return frameFullCache[id];
}

async function goToCapture(){
  shots = [];
  showScreen('screen-capture');
  document.getElementById('countdown').textContent='';

  // El marco NO se muestra durante la captura. Se descarga en segundo plano
  // mientras arranca la cámara, para que la composición final sea instantánea.
  preloadFrameFull(selectedFrame.id).catch(()=>{ /* si falla, se verá el error al componer */ });
  await startCamera();

  runCaptureSequence();
}

async function runCaptureSequence(){
  const total = selectedFrame.windows.length;
  for(let i=0;i<total;i++){
    document.getElementById('shotProgress').textContent = `Foto ${i+1} de ${total}`;
    await countdown(i===0 ? 8 : 5); // 8 s la primera (para colocarse), 5 s las siguientes
    const shot = grabFrame();
    shots.push(shot);
    flashEl.className='flash on';
    setTimeout(()=> flashEl.className='flash off', 60);
    await sleep(500);
  }
  finishAndCompose();
}

function countdown(n){
  return new Promise(resolve=>{
    const el = document.getElementById('countdown');
    let c = n;
    el.textContent = c;
    const t = setInterval(()=>{
      c--;
      if(c<=0){ clearInterval(t); el.textContent=''; resolve(); }
      else el.textContent = c;
    },1000);
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function grabFrame(){
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  const cx = c.getContext('2d');
  cx.drawImage(video,0,0,c.width,c.height);
  return c;
}

document.getElementById('btnFlip').onclick = ()=>{
  currentFacing = currentFacing==='user' ? 'environment' : 'user';
  startCamera();
};
document.getElementById('btnCancel').onclick = ()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  showScreen('screen-select');
};

/* =========================================================================
   3) COMPOSICIÓN — la cámara ya está apagada aquí; ahora sí pedimos
      la imagen del marco a tamaño completo, una sola vez.
   ========================================================================= */
let finalDataURL = null;

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function drawCover(ctx, img, x, y, w, h){
  const iw = img.width, ih = img.height;
  const scale = Math.max(w/iw, h/ih);
  const dw = iw*scale, dh = ih*scale;
  const dx = x + (w-dw)/2, dy = y + (h-dh)/2;
  ctx.drawImage(img, dx, dy, dw, dh);
}

async function finishAndCompose(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  showScreen('screen-processing');

  try{
    // Reutiliza la imagen ya precargada durante la captura (goToCapture) —
    // normalmente ya está lista, así que esto es instantáneo.
    const frameImg = await preloadFrameFull(selectedFrame.id);

    const c = document.createElement('canvas');
    c.width = CANVAS_W; c.height = CANVAS_H;
    const ctx = c.getContext('2d');

    selectedFrame.windows.forEach((win,i)=>{
      ctx.save();
      ctx.beginPath(); ctx.rect(win.x, win.y, win.w, win.h); ctx.clip();
      drawCover(ctx, shots[i], win.x, win.y, win.w, win.h);
      ctx.restore();
    });
    ctx.drawImage(frameImg, 0, 0, CANVAS_W, CANVAS_H);

    finalDataURL = c.toDataURL('image/jpeg', 0.92); // JPEG: ~10x más ligero que PNG, sube rápido con datos móviles
    document.getElementById('resultImg').src = finalDataURL;
    document.getElementById('status').textContent = '';
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnSave').textContent = 'Guardar foto';
    showScreen('screen-result');
  }catch(e){
    showFatalError('Error al componer la foto: ' + e.message);
    showScreen('screen-select');
  }
}

document.getElementById('btnRetry').onclick = ()=> goToCapture();

// Vuelve a la pantalla de elegir marco (para el siguiente invitado).
function backToFrameSelection(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  selectedFrame = null;
  shots = [];
  finalDataURL = null;
  document.querySelectorAll('.frame-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('btnContinue').disabled = true;
  document.getElementById('status').textContent = '';
  showScreen('screen-select');
}
document.getElementById('btnBackToFrames').onclick = backToFrameSelection;
document.getElementById('btnNewSession').onclick = backToFrameSelection;

// Guarda la foto en el propio móvil del invitado (vía el share sheet nativo,
// que en iPhone ofrece "Guardar en Fotos"; si el navegador no soporta
// compartir archivos, se descarga directamente) y, en paralelo, sube una
// copia a la carpeta de Drive para que los novios tengan acceso a todas las
// fotos. Ambos pasos son independientes: si falla la subida a Drive, el
// invitado ya tiene su foto igualmente.
document.getElementById('btnSave').onclick = async ()=>{
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span>Guardando…';

  const filename = 'seba_y_teresa_' + Date.now() + '.jpg';

  function downloadFallback(){
    const a = document.createElement('a');
    a.href = finalDataURL;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  try{
    const blob = await (await fetch(finalDataURL)).blob();
    const file = new File([blob], filename, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Foto del fotomatón'});
    }else{
      downloadFallback();
    }
  }catch(e){
    // Si el invitado cierra el panel de compartir (AbortError), no es un error real.
    if(e.name !== 'AbortError') downloadFallback();
  }

  statusEl.textContent = 'Guardando una copia para los novios…';
  apiPost({ base64Data: finalDataURL, filename }).then(()=>{
    statusEl.textContent = '¡Listo! Foto guardada ✓';
    btn.textContent = 'Guardada ✓';
  }).catch(err=>{
    statusEl.textContent = 'Tu foto ya está guardada en el móvil. (No se pudo subir la copia a Drive: ' + err.message + ')';
    btn.disabled = false;
    btn.textContent = 'Reintentar copia a Drive';
  });
};

/* =========================================================================
   utilidades
   ========================================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showFatalError(msg){
  let el = document.getElementById('fatalError');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalError';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;'
      + 'font-size:13px;padding:12px 16px;z-index:999;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
}

window.addEventListener('error', e=> showFatalError('Error: ' + e.message));
window.addEventListener('unhandledrejection', e=> showFatalError('Error: ' + (e.reason && e.reason.message || e.reason)));

init();
</script>
</body>
</html>
